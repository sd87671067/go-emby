name: go-emby

services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: emby
      POSTGRES_USER: emby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    # 仅供 host 网络的 go-emby 从宿主机访问；bridge 模式仍走 postgres:5432。
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U emby -d emby
      interval: 5s
      timeout: 5s
      retries: 20

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ==========================================================
  # go-emby
  # ==========================================================

  go-emby:
    image: ghcr.io/sd87671067/go-emby:${IMAGE_TAG:-latest}
    restart: unless-stopped

    # 默认以 root 身份运行，避免宿主机媒体目录由 root:root 创建时
    # 无法写入 NFO、海报等刮削文件。需要降权时可在 .env 设置 PUID/PGID。
    user: "${PUID:-0}:${PGID:-0}"

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${HTTP_PORT:-8097}:8097"

    environment:

      DATABASE_URL: >-
        postgres://emby:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/emby?sslmode=disable

      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 设置 ADMIN_PASSWORD}

      LICENSE_KEY: ${LICENSE_KEY:-}

      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://tl.macacaaca.top}

      LICENSE_CA_FILE: ${LICENSE_CA_FILE:-}

      PUBLIC_URL: ${PUBLIC_URL:-}

      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}

      MEDIA_INFO_ROOT: /app/data

      FILE_MANAGER_ROOT: /media

      MEDIA_ROOTS: ${MEDIA_ROOTS:-/media}


    volumes:

      # ======================================================
      # go-emby 自身数据
      # ======================================================

      - type: bind
        source: ${APP_DATA_PATH:-./app-data}
        target: /app/data
        bind:
          create_host_path: true

      - type: bind
        source: ${APP_BACKUP_PATH:-./app-backups}
        target: /app/backups
        bind:
          create_host_path: true


      # ======================================================
      # 媒体目录
      #
      # MEDIA_PATH 是宿主机目录，必须事先存在；容器内固定为 /media。
      # 默认读写，支持 NFO、海报等文件写入。
      # 其他媒体目录可按下方示例自行增加。
      # ======================================================


      - type: bind
        source: ${MEDIA_PATH:-./media}
        target: /media
        read_only: false
        bind:
          create_host_path: false


      # 电影
      # - /vol1/1000/strm/dy:/movies:rw


      # 电视剧
      # - /vol1/1000/strm/dsj:/tv:rw


      # 动漫
      # - /vol1/1000/strm/dm:/anime:rw


      # 音乐
      # - /vol1/1000/strm/yy:/music:rw


      # ======================================================
      # 更多示例
      #
      # - /data1/media:/data1:rw
      # - /data2/media:/data2:rw
      # - /mnt/115:/115:rw
      # - /mnt/alist:/alist:rw
      #
      # 如果启用了多个容器目录，例如：
      #
      #   /media
      #   /movies
      #   /tv
      #   /anime
      #
      # 请同步修改 .env：
      #
      # MEDIA_ROOTS=/media:/movies:/tv:/anime
      # ======================================================


      # ======================================================
      # 授权机器 ID
      # ======================================================

      - type: bind
        source: /etc/machine-id
        target: /run/license-machine-id
        read_only: true
        bind:
          create_host_path: false


      # ======================================================
      # 私有 CA / secrets
      #
      # 首次启动时自动创建空目录；如使用 LICENSE_CA_FILE，
      # 请将证书放在此目录中。
      # ======================================================

      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: true


    stop_grace_period: 45s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
