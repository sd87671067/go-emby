# Go-Emby 一键部署：保存本文件后运行 docker compose up -d
# 默认访问：http://服务器IP:8097；无需额外创建 .env
# 要使用宿主机影视文件，请修改下方 MEDIA_PATH 对应的挂载路径。
name: go-emby
services:
  # 影视服务器：网页管理、海报墙和播放入口
  go-emby:
    image: ghcr.io/sd87671067/go-emby:${IMAGE_TAG:-latest}
    user: "${PUID:-0}:${PGID:-0}"
    restart: unless-stopped
    depends_on:
      # 数据库：保存用户、媒体库记录等信息
      postgres:
        condition: service_healthy
      # 一次性准备数据库结构：成功后退出，不会一直运行
      schema-prepare:
        condition: service_completed_successfully
    ports: ["${HTTP_PORT:-8097}:8097"]
    environment: &app-env
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://tl.macacaaca.top}
      PUBLIC_URL: ${PUBLIC_URL:-}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
      XIAOYA_USERNAME: ${XIAOYA_USERNAME:-dav}
      XIAOYA_PASSWORD: ${XIAOYA_PASSWORD:-}
      GO_EMBY_INSTANCE_ID: ${GO_EMBY_INSTANCE_ID:-}
      MEDIA_INFO_ROOT: /app/data
      FILE_MANAGER_ROOT: /media
      MEDIA_ROOTS: ${MEDIA_ROOTS:-/media}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD:-$$(cat /run/bootstrap/postgres-password)}"
        [ -n "$$DATABASE_URL" ] || export DATABASE_URL="postgres://emby:$$(printf '%s' "$$PGPASSWORD" | od -An -v -tx1 | tr -d ' \n' | sed 's/../%&/g')@postgres:5432/emby?sslmode=disable"
        if [ -z "$$ADMIN_PASSWORD" ]; then
          (
            umask 077
            if [ ! -s /app/data/initial-admin-password ]; then
              od -An -N24 -tx1 /dev/urandom | tr -d ' \n' > /app/data/initial-admin-password.tmp
              mv /app/data/initial-admin-password.tmp /app/data/initial-admin-password
            fi
          )
          export ADMIN_PASSWORD="$$(cat /app/data/initial-admin-password)"
        fi
        exec /usr/local/bin/go-emby
    volumes:
      # 左侧为数据保存位置，右侧为容器内路径；保持默认即可使用
      - ${APP_DATA_PATH:-app-data}:/app/data
      - ${APP_BACKUP_PATH:-app-backups}:/app/backups
      # 默认 media 数据卷；可改成 /你的影视目录:/media:rw
      - ${MEDIA_PATH:-media}:/media:rw
      - bootstrap:/run/bootstrap:ro
      - /etc/machine-id:/run/license-machine-id:ro
    stop_grace_period: 45s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: emby
      POSTGRES_USER: emby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$$POSTGRES_PASSWORD" ]; then
          umask 077
          if [ ! -s /run/bootstrap/postgres-password ]; then
            if [ -s /var/lib/postgresql/data/PG_VERSION ]; then
              echo 'Existing database: set the original POSTGRES_PASSWORD; refusing to replace credentials.' >&2
              exit 1
            fi
            od -An -N24 -tx1 /dev/urandom | tr -d ' \n' > /run/bootstrap/postgres-password.tmp
            mv /run/bootstrap/postgres-password.tmp /run/bootstrap/postgres-password
          fi
          export POSTGRES_PASSWORD="$$(cat /run/bootstrap/postgres-password)"
        fi
        exec /usr/local/bin/docker-entrypoint.sh postgres
    volumes:
      - ${POSTGRES_DATA_PATH:-postgres-data}:/var/lib/postgresql/data
      - bootstrap:/run/bootstrap
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U emby -d emby"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  schema-prepare:
    image: ghcr.io/sd87671067/go-emby:${IMAGE_TAG:-latest}
    user: "0:0"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD:-$$(cat /run/bootstrap/postgres-password)}"
        [ -n "$$DATABASE_URL" ] || export DATABASE_URL="postgres://emby:$$(printf '%s' "$$PGPASSWORD" | od -An -v -tx1 | tr -d ' \n' | sed 's/../%&/g')@postgres:5432/emby?sslmode=disable"
        exec /usr/local/bin/go-emby --prepare-schema
    volumes: ["bootstrap:/run/bootstrap:ro"]
    healthcheck: {disable: true}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
# Docker 会自动创建下列数据卷，无需手动创建文件夹。
# 更新容器不会删除数据卷；切勿随意执行 docker compose down -v。
volumes:
  app-data:       # Go-Emby 设置和应用数据
  app-backups:    # Go-Emby 备份文件
  postgres-data:  # PostgreSQL 数据库，包含用户和媒体库记录
  media:          # 默认媒体目录，可换成宿主机影视目录
  bootstrap:      # 首次安装生成的数据库密码，数据库与应用共用；不要删除
