async function refreshLogs(generation){try{const data=await api('/admin/logs'+(logCategory==='proxy'?'?category=proxy':''));if(generation!==logGeneration||!$('#logs').open)return;$('#log-status').textContent=logCategory==='proxy'?`反代调试${data.Enabled?'已开启':'已关闭'} · 最近100条，单条响应最多32 KiB；重启清空。仅记录到达本服务的请求，CDN直连及连接前的DNS/TLS故障不在捕获范围。`:logCategory==='redirect'?'记录本服务重定向状态、目标和错误；成功表示已返回重定向，客户端后续 CDN 播放结果需由客户端确认。':logCategory==='probe'?`并发上限 ${data.ProbeConcurrency} · 正在提取 ${data.ProbeRunning} · 等待数量 ${data.ProbeWaiting}`:logCategory==='playback'?`在线播放 ${data.OnlinePlayback} 台设备`:'最近刷新 '+new Date().toLocaleTimeString();const entries=data.Entries.filter(x=>logCategory==='error'?(x.Category==='error'||x.State==='error'):x.Category===logCategory);$('#log-content').innerHTML=entries.map(x=>{const pct=scanPercent(x);return `<article class="log-entry"><strong>${esc(x.Name)}</strong> · ${esc(logStates[x.State]||x.State)}<p>${esc(new Date(x.Started).toLocaleString())}</p>${['scan','update'].includes(x.Category)?`<progress max="100" value="${pct}"></progress><span>${pct}% · ${x.Done}/${x.Total} 部/集</span><p>${x.Current==='清理已删除条目'?'<span class="inline-icon" title="清理已删除条目" aria-label="清理已删除条目"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3l-6 10M8 11l7 4-4 7-9-5Z"/></svg></span>':esc(x.Current)}</p>`:''}${x.Category==='playback'&&x.State!=='login'?`<p>${x.Online?'🟢 在线播放':'离线 / 已停止'} · ${x.RunTimeTicks?x.Progress.toFixed(1)+'%':'已播放 '+Math.floor(x.PositionTicks/1e7)+' 秒（总时长未知）'}<br>用户ID：${esc(x.UserID)}<br>视频ID：${esc(x.ItemID)}<br>用户名：${esc(x.Username)}<br>IP：${esc(x.IP)}<br>设备：${esc(x.Device)}<br>客户端：${esc(x.Client)}<br>请求视频：${esc(x.Name)}</p>`:''}${x.State==='login'?`<p>用户名：${esc(x.Username)} · 客户端：${esc(x.Client)} · 设备：${esc(x.Device)}</p>`:''}${x.Category==='warning'?`<p>用户名：${esc(x.Username||'未知')} · IP：${esc(x.IP)} · 设备：${esc(x.Device)}</p>`:''}${['proxy','redirect'].includes(x.Category)?`<pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">${esc(x.Current)}</pre>`:''}${x.Error?`<p role="alert">${esc(x.Error)}</p>`:''}</article>`}).join('')||'<p>暂无记录</p>'}catch(e){if(generation===logGeneration)$('#log-status').textContent='日志读取失败：'+e.message}finally{if(generation===logGeneration&&$('#logs').open)logTimer=setTimeout(()=>refreshLogs(generation),1000)}}
$('#logs').addEventListener('cancel',()=>{clearTimeout(logTimer);logGeneration++});

 form.innerHTML=[['Browse','浏览简介时后台完整提取媒体信息'],['PreloadNext','播放剧集时，预加载下一集媒体信息'],['Persistent','媒体信息持久化']].map(([k,label])=>`<label class="row"><input type="checkbox" name="${k}" ${c[k]?'checked':''}>${label}</label>`).join('')+`<p>浏览简介立即返回已有信息，后台一次完整提取视频、音频和字幕信息，所有任务遵守媒体信息提取并发设置。开启下一集预加载时，播放开始后延迟在后台提取下一集；关闭后不再自动预加载。已有完整信息会跳过，同一任务合并去重，播放不等待提取。视频由客户端直连 CDN；仅后台提取产生少量媒体读取流量。</p><p>持久化关闭：影视文件删除后，自动清理对应媒体信息。开启：保留媒体信息供重新入库复用。</p><label class="row">媒体信息保存目录 <input name="Directory" value="${esc(c.Directory)}" required style="flex:1"><button type="button" class="secondary icon-button" title="恢复媒体信息" aria-label="恢复媒体信息" onclick="restoreMediaDialog()"><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 3v7h7M12 7v5l3 2"/></svg></button></label><p><small>要将神医助手或者Mediainfokeeper媒体信息放入go-emby的媒体信息目录中。</small></p><p>统一保存到数据目录下；更换目录会迁移已有媒体信息。</p><label class="row">媒体信息提取并发 <input name="Concurrency" type="number" min="1" max="16" value="${c.Concurrency}" required></label><button>保存设置</button>`;
 form.onsubmit=run(async e=>{e.preventDefault();const b={};for(const k of ['Browse','PreloadNext','Persistent'])b[k]=form.elements[k].checked;b.Directory=form.elements.Directory.value;b.Concurrency=Number(form.elements.Concurrency.value);await api('/admin/media-info','PUT',b);toast('媒体信息设置已保存');await refreshMediaQueue()});
 const concurrency=form.elements.Concurrency;
 const validate=()=>concurrency.setCustomValidity(Number.isInteger(Number(concurrency.value))&&Number(concurrency.value)>=1&&Number(concurrency.value)<=16?'':'媒体信息提取并发必须为 1–16 的整数，不能设置为 0');
 concurrency.addEventListener('input',validate);validate();
 await refreshMediaQueue();
}
async function refreshMediaQueue(){clearTimeout(mediaTimer);const el=$('#media-queue');if(view!=='admin'||!el||el.closest('section').hidden)return;try{const b=await api('/admin/logs'+(logCategory==='proxy'?'?category=proxy':''));el.textContent=`等待提取数量：${b.ProbeWaiting} · 正在提取：${b.ProbeRunning} · 并发上限：${b.ProbeConcurrency}`}catch(e){el.textContent='队列读取失败：'+e.message}finally{mediaTimer=setTimeout(refreshMediaQueue,1000)}}
function renderOrder(){const box=$('#order');box.innerHTML=adminLibs.map(x=>`<div class="row" data-id="${esc(x.Id)}"><button class="drag-handle secondary" aria-label="拖动 ${esc(x.Name)} 排序，键盘方向键调整" style="touch-action:none;cursor:grab">☰</button><strong class="info">${esc(x.Name)}</strong></div>`).join('');
box.querySelectorAll('.drag-handle').forEach(h=>{h.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();const row=h.closest('.row'),before=[...box.children];box.setPointerCapture(e.pointerId);row.style.opacity='.5';box.onpointermove=e=>{const y=e.clientY;for(const other of [...box.children]){if(other===row)continue;const r=other.getBoundingClientRect();if(y>=r.top&&y<=r.bottom){box.insertBefore(row,y<r.top+r.height/2?other:other.nextSibling);break}}if(y<80)window.scrollBy(0,-20);if(y>innerHeight-80)window.scrollBy(0,20)};const finish=cancel=>{box.onpointermove=null;box.onpointerup=null;box.onpointercancel=null;row.style.opacity='';if(cancel)before.forEach(x=>box.appendChild(x));adminLibs=[...box.children].map(el=>adminLibs.find(x=>x.Id===el.dataset.id))};box.onpointerup=()=>finish(false);box.onpointercancel=()=>finish(true)};h.onkeydown=e=>{if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const row=h.closest('.row'),i=adminLibs.findIndex(x=>x.Id===row.dataset.id),j=i+(e.key==='ArrowUp'?-1:1);if(j<0||j>=adminLibs.length)return;[adminLibs[i],adminLibs[j]]=[adminLibs[j],adminLibs[i]];renderOrder();box.children[j].querySelector('button').focus()}})}

async function pickDirectory(select,path='/media',after=''){let d=$('#fm-picker');if(!d){d=document.createElement('dialog');d.id='fm-picker';document.body.appendChild(d);d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.target===d&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))d.close()})}const b=await api('/admin/directories?'+new URLSearchParams({Path:path,After:after}));d.innerHTML=`<h2>选择目录</h2><p class="picker-path">${esc(b.Path)}</p><div class="directory-list">${b.Directories.map((x,i)=>`<button class="secondary" data-index="${i}">${fmIcon('folder')}<span class="directory-name">${esc(x.Name)}</span><span aria-hidden="true">›</span></button>`).join('')||'<p class="empty">此目录没有子文件夹</p>'}${b.Next?'<button id="fm-next" class="secondary">下一页</button>':''}</div><footer class="picker-actions"><button id="fm-up" class="secondary" ${b.Path==='/media'?'disabled':''}>上一级</button><button id="fm-select">选择此目录</button></footer>`;if(!d.open)d.showModal();$('#fm-select').onclick=()=>{select(b.Path);d.close()};$('#fm-up').onclick=run(()=>pickDirectory(select,b.Path.slice(0,b.Path.lastIndexOf('/'))||'/media'));$('#fm-next')?.addEventListener('click',run(()=>pickDirectory(select,b.Path,b.Next)));d.querySelectorAll('[data-index]').forEach(el=>el.onclick=run(async()=>{el.classList.add('selected');await pickDirectory(select,b.Directories[Number(el.dataset.index)].Path)}))}

document.addEventListener('keydown',e=>{if(e.target.matches('.library-card')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click()}if(e.target.matches('input[readonly][name=path]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click()}});
document.addEventListener('click',e=>document.querySelectorAll('.fm-menu[open]').forEach(d=>{if(!d.contains(e.target))d.open=false}));

async function loadServerName(){try{const c=await api('/System/Info/Public');document.querySelector('.logo').textContent=c.ServerName;document.title=c.ServerName+' · 影库'}catch{}}
async function loadKeys(){const keys=await api('/admin/keys');const target=$('#api-keys');if(!target)return;target.innerHTML=keys.map(k=>`<div class="row"><div class="info"><strong>${esc(k.Name)}</strong><p><code>${esc(k.MaskedKey)}</code></p></div><span class="muted">${new Date(k.Created*1000).toLocaleString()}</span><button class="danger" data-key="${esc(k.Id)}">删除</button></div>`).join('')||'<p>暂无API密钥</p>';target.querySelectorAll('[data-key]').forEach(b=>b.onclick=run(async()=>{if(confirm('删除此API密钥？使用它的客户端将无法继续访问。')){await api('/admin/keys','DELETE',{ID:b.dataset.key});await loadKeys()}}))}
function createKey(){fmDialog('新建API密钥',`<label>密钥名称<input name="name" placeholder="输入应用或设备名称" required maxlength="100" autocomplete="off"></label>`,async f=>{const result=await api('/admin/keys','POST',{Name:f.get('name')});$('#modal').innerHTML=`<h2>API密钥已创建</h2><div class="fm-form"><p>完整密钥仅显示这一次，请立即复制保存。关闭后只能查看脱敏信息。</p><code id="new-key-secret" style="overflow-wrap:anywhere;user-select:all">${esc(result.Token)}</code><div class="bar form-actions"><button type="button" onclick="closeModal()">已保存，关闭</button></div></div>`;await loadKeys();return false})}
loadServerName();

function confirmScan(message){return new Promise(resolve=>{let d=document.createElement('dialog');d.innerHTML=`<h2>确认操作</h2><p>${esc(message)}</p><div class="bar"><button data-confirm>确认</button><button class="secondary" data-cancel>取消</button></div>`;document.body.appendChild(d);let answer=false;d.querySelector('[data-confirm]').onclick=()=>{answer=true;d.close()};d.querySelector('[data-cancel]').onclick=()=>d.close();d.onclose=()=>{d.remove();resolve(answer)};d.showModal()})}
async function controlScan(paused){if(paused&&!await confirmScan('暂停所有刷新和扫描任务？恢复后将继续处理。'))return;await api('/admin/scan-control','PUT',{Paused:paused});toast(paused?'扫描已请求暂停':'扫描已恢复')}

function restoreMediaDialog(){fmDialog('恢复媒体信息', '<p>是否恢复神医助手或者 Mediainfokeeper 的媒体信息？请先保存设置，并将 JSON 放入媒体信息保存目录。已有完整信息会跳过，同名匹配不唯一时跳过。</p>',async()=>{const r=await api('/admin/media-info/restore','POST',{});toast(`恢复完成：成功 ${r.Imported}，跳过 ${r.Skipped}，失败 ${r.Failed}`)})}
function bindPosterMenus(){if(!user?.Policy?.IsAdministrator)return;document.querySelectorAll('#wall .card').forEach(el=>{let timer,x,y,held=false;const cancel=()=>clearTimeout(timer);el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;held=false;x=e.clientX;y=e.clientY;timer=setTimeout(()=>{held=true;posterMenu(el)},550)});el.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-x,e.clientY-y)>10)cancel()});['pointerup','pointercancel','pointerleave'].forEach(k=>el.addEventListener(k,cancel));el.addEventListener('click',e=>{if(held){e.preventDefault();e.stopImmediatePropagation();held=false}},true);el.addEventListener('contextmenu',e=>{e.preventDefault();cancel();held=true;posterMenu(el)})})}
function posterMenu(el){const id=el.dataset.id,name=el.querySelector('strong').textContent,d=$('#modal');d.innerHTML='<h2>'+esc(name)+'</h2><div class="bar"><button id="poster-rename" class="secondary">重命名显示名称</button><button id="poster-delete" class="secondary poster-delete">删除媒体</button><button onclick="closeModal()" class="secondary">取消</button></div>';if(!d.open)d.showModal();$('#poster-rename').onclick=()=>{d.close();fmDialog('重命名显示名称',`<label>显示名称<input name="name" required maxlength="256" value="${esc(name)}"></label>`,async f=>{await api('/admin/media-item','PUT',{ID:id,Name:f.get('name')});await loadWall();toast('显示名称已保存')})};$('#poster-delete').onclick=()=>{d.close();fmDialog('删除媒体',`<p>确认删除 ${esc(name)}？将删除媒体索引及对应 STRM 文件。</p><label class="toggle-label">连同 STRM 所在的目录一起删除<input name="directory" type="checkbox"></label>`,async f=>{await api('/admin/media-item','DELETE',{ID:id,DeleteDirectory:f.get('directory')==='on'});await loadWall();toast('删除成功')})}}
</script></body></html>
